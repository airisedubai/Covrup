<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheer Gen - AI Clothing Editor</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #111;
            color: #eee;
        }
        #canvas {
            border: 1px solid #444;
            cursor: crosshair;
            max-width: 100%;
            background: #1a1a1a;
        }
        button {
            padding: 10px 20px;
            background: #6a0dad;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #8a2be2;
        }
        #result {
            border: 1px solid #444;
            max-width: 512px;
            max-height: 512px;
        }
    </style>
</head>
<body>
    <h2>Upload & Mask Clothes</h2>
    <input type="file" id="upload" accept="image/*"><br><br>
    <canvas id="canvas" width="512" height="512"></canvas><br><br>
    <button id="generate">Generate Sheer</button>
    <h3>Result:</h3>
    <img id="result" style="max-width: 512px;">

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let img = new Image();
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;

        document.getElementById('upload').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                img.onload = () => {
                    // Maintain aspect ratio fitting inside 512x512
                    const scale = Math.min(512 / img.width, 512 / img.height);
                    canvas.width = 512;
                    canvas.height = 512;
                    ctx.clearRect(0, 0, 512, 512);
                    ctx.drawImage(img, (512 - img.width * scale) / 2, (512 - img.height * scale) / 2, img.width * scale, img.height * scale);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Drawing logic for mask
        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const pos = getMousePos(e);
            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const pos = getMousePos(e);
            
            ctx.beginPath();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 30;
            ctx.lineCap = 'round';
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            
            lastX = pos.x;
            lastY = pos.y;
        });

        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseleave', () => isDrawing = false);

        // Generate button logic
        document.getElementById('generate').addEventListener('click', async () => {
            const btn = document.getElementById('generate');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                // Get original image data URL
                const imgDataUrl = img.src;
                
                // Create mask canvas (black background with white strokes)
                const maskCanvas = document.createElement('canvas');
                maskCanvas.width = 512;
                maskCanvas.height = 512;
                const maskCtx = maskCanvas.getContext('2d');
                
                // Default mask is BLACK (no change)
                maskCtx.fillStyle = 'black';
                maskCtx.fillRect(0, 0, 512, 512);
                
                // Copy white strokes from the main canvas
                maskCtx.drawImage(canvas, 0, 0);
                
                // Ensure the drawn area is white
                maskCtx.globalCompositeOperation = 'source-over';
                
                const maskDataUrl = maskCanvas.toDataURL('image/png');

                // Prepare form data
                const formData = new FormData();
                
                // Convert Data URLs to Blobs
                const imgBlob = await (await fetch(imgDataUrl)).blob();
                const maskBlob = await (await fetch(maskDataUrl)).blob();
                
                formData.append('image', imgBlob, 'image.png');
                formData.append('mask', maskBlob, 'mask.png');

                // Send to backend (Update URL if hosted elsewhere)
                const res = await fetch('http://localhost:8000/make_sheer', {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) throw new Error(`Server error: ${res.status}`);
                
                const data = await res.json();
                document.getElementById('result').src = data.image;
                
            } catch (error) {
                alert(`Error: ${error.message}. Make sure the backend is running (uvicorn backend:app --reload).`);
                console.error(error);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
